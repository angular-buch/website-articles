<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 340" fill="none">
  <rect width="760" height="340" rx="8" fill="#FFFFFF"/>

  <!-- Fall A: async httpResource -->
  <text x="30" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1E1E1E">A: async httpResource – DOM beim Capture noch leer</text>
  <!-- Zeitachse -->
  <line x1="30" y1="90" x2="700" y2="90" stroke="#ced4da" stroke-width="1.5"/>
  <!-- Capture-Marker -->
  <line x1="250" y1="70" x2="250" y2="110" stroke="#e03131" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="250" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e03131">VT-Capture</text>
  <!-- Navigation -->
  <circle cx="60" cy="90" r="5" fill="#495057"/>
  <text x="60" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#868e96">Navigation</text>
  <!-- Request-Balken endet NACH Capture -->
  <rect x="60" y="83" width="330" height="14" rx="4" fill="#e03131" fill-opacity="0.15" stroke="#e03131" stroke-width="1.2"/>
  <text x="225" y="94" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#e03131">HTTP-Request läuft noch …</text>
  <text x="420" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e03131">Daten zu spät → nur Fade ✗</text>

  <!-- Trennlinie -->
  <line x1="30" y1="170" x2="730" y2="170" stroke="#e9ecef" stroke-width="1"/>

  <!-- Fall B: blocking Route-Resource -->
  <text x="30" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1E1E1E">B: blocking Route-Resource – Daten vor dem Capture da</text>
  <line x1="30" y1="260" x2="700" y2="260" stroke="#ced4da" stroke-width="1.5"/>
  <!-- Request-Balken endet VOR Aktivierung/Capture -->
  <circle cx="60" cy="260" r="5" fill="#495057"/>
  <text x="60" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#868e96">Navigation</text>
  <rect x="60" y="253" width="150" height="14" rx="4" fill="#2f9e44" fill-opacity="0.15" stroke="#2f9e44" stroke-width="1.2"/>
  <text x="135" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2f9e44">Resource lädt</text>
  <!-- Aktivierung + Capture nach dem Laden -->
  <line x1="230" y1="240" x2="230" y2="280" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="230" y="234" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2f9e44">Aktivierung</text>
  <line x1="300" y1="240" x2="300" y2="280" stroke="#8001c6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8001c6">VT-Capture</text>
  <text x="420" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2f9e44">DOM vollständig → Morph ✓</text>

  <text x="380" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#adb5bd">Angular wartet bei View Transitions nicht auf asynchrone Daten – das Timing muss die Route-Resource garantieren.</text>
</svg>
