<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 220" fill="none">
  <rect width="760" height="220" rx="8" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#1E1E1E">document.startViewTransition()</text>

  <!-- Phase 1 -->
  <rect x="24" y="70" width="150" height="90" rx="8" fill="#8001c6" fill-opacity="0.08" stroke="#8001c6" stroke-width="1.5"/>
  <text x="99" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24">📸</text>
  <text x="99" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">1. Alten Zustand</text>
  <text x="99" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">erfassen</text>

  <path d="M180 115 L202 115" stroke="#495057" stroke-width="2"/>
  <polygon points="200,110 212,115 200,120" fill="#495057"/>

  <!-- Phase 2 -->
  <rect x="216" y="70" width="150" height="90" rx="8" fill="#F8F8F8" stroke="#ced4da" stroke-width="1.5"/>
  <text x="291" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24">🔀</text>
  <text x="291" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">2. DOM-Update</text>
  <text x="291" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#868e96">(Route wechselt)</text>

  <path d="M372 115 L394 115" stroke="#495057" stroke-width="2"/>
  <polygon points="392,110 404,115 392,120" fill="#495057"/>

  <!-- Phase 3 -->
  <rect x="408" y="70" width="150" height="90" rx="8" fill="#8001c6" fill-opacity="0.08" stroke="#8001c6" stroke-width="1.5"/>
  <text x="483" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24">📸</text>
  <text x="483" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">3. Neuen Zustand</text>
  <text x="483" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">erfassen</text>

  <path d="M564 115 L586 115" stroke="#495057" stroke-width="2"/>
  <polygon points="584,110 596,115 584,120" fill="#495057"/>

  <!-- Phase 4 -->
  <rect x="600" y="70" width="150" height="90" rx="8" fill="#8001c6" fill-opacity="0.15" stroke="#8001c6" stroke-width="1.5"/>
  <text x="675" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24">🎞️</text>
  <text x="675" y="128" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">4. Übergang</text>
  <text x="675" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1E1E1E">animieren</text>

  <text x="380" y="196" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#868e96">Der Browser interpoliert zwischen altem und neuem Snapshot – Angular stößt dies beim Routenwechsel an.</text>
</svg>
