<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 400" fill="none">
  <rect width="760" height="400" rx="8" fill="#FFFFFF"/>

  <!-- ===================== Linke Ansicht: Liste ===================== -->
  <text x="190" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1E1E1E">Listenansicht</text>

  <!-- Panel -->
  <rect x="30" y="46" width="320" height="286" rx="8" fill="#F8F8F8" stroke="#ced4da" stroke-width="1.5"/>

  <!-- Breite, flache Listen-Card 1 (mit Cover rechts) -->
  <rect x="46" y="62" width="288" height="104" rx="6" fill="#FFFFFF" stroke="#adb5bd" stroke-width="1.5"/>
  <!-- Textspalte links -->
  <rect x="60" y="76" width="150" height="11" rx="2" fill="#ced4da"/>
  <rect x="60" y="94" width="120" height="7" rx="2" fill="#e9ecef"/>
  <rect x="60" y="106" width="90" height="7" rx="2" fill="#e9ecef"/>
  <!-- Footer-Aktionen (bleiben links vom Cover) -->
  <rect x="60" y="134" width="40" height="12" rx="2" fill="#e9ecef"/>
  <rect x="200" y="130" width="34" height="18" rx="4" fill="#495057" fill-opacity="0.6"/>
  <!-- Cover rechts, hochformatig, füllt Card-Höhe -->
  <rect x="258" y="62" width="76" height="104" rx="0" fill="#8001c6" fill-opacity="0.18" stroke="#8001c6" stroke-width="1.5"/>
  <text x="296" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26">📘</text>

  <!-- Breite, flache Listen-Card 2 (abgeblendet, zur Andeutung der Liste) -->
  <rect x="46" y="182" width="288" height="104" rx="6" fill="#FFFFFF" stroke="#e9ecef" stroke-width="1.5"/>
  <rect x="60" y="196" width="150" height="11" rx="2" fill="#edeef0"/>
  <rect x="60" y="214" width="120" height="7" rx="2" fill="#f1f3f5"/>
  <rect x="258" y="182" width="76" height="104" fill="#adb5bd" fill-opacity="0.12" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="296" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" opacity="0.3">📗</text>

  <!-- ===================== Rechte Ansicht: Detail ===================== -->
  <text x="575" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1E1E1E">Detailansicht</text>

  <!-- Panel -->
  <rect x="430" y="46" width="300" height="286" rx="8" fill="#F8F8F8" stroke="#ced4da" stroke-width="1.5"/>

  <!-- Titel -->
  <rect x="448" y="64" width="180" height="14" rx="3" fill="#ced4da"/>
  <!-- Untertitel -->
  <rect x="448" y="86" width="240" height="7" rx="2" fill="#e9ecef"/>
  <!-- Meta-Zeile (Authors / ISBN / Created) angedeutet -->
  <rect x="448" y="104" width="60" height="6" rx="2" fill="#edeef0"/>
  <rect x="536" y="104" width="60" height="6" rx="2" fill="#edeef0"/>
  <rect x="624" y="104" width="60" height="6" rx="2" fill="#edeef0"/>
  <!-- Beschreibung -->
  <rect x="448" y="124" width="236" height="6" rx="2" fill="#f1f3f5"/>
  <rect x="448" y="136" width="220" height="6" rx="2" fill="#f1f3f5"/>
  <!-- Großes Cover unten links -->
  <rect x="448" y="158" width="120" height="156" rx="0" fill="#8001c6" fill-opacity="0.18" stroke="#8001c6" stroke-width="1.5"/>
  <text x="508" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40">📘</text>

  <!-- ===================== Morph-Pfad: kleines Cover rechts → großes Cover ===================== -->
  <path d="M338 110 C 388 78, 404 150, 448 170" stroke="#8001c6" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <!-- Pfeilspitze am Zielpunkt (448,170), ausgerichtet entlang der Pfad-Tangente -->
  <polygon points="448,170 433,169 440,159" fill="#8001c6"/>

  <!-- ===================== Beschriftung (unterhalb der Panels) ===================== -->
  <text x="380" y="356" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8001c6">gleicher view-transition-name</text>
  <text x="380" y="374" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#868e96">→ Browser interpoliert Position &amp; Größe</text>
  <text x="380" y="392" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#adb5bd">book-cover-&lt;isbn&gt; existiert in beiden Ansichten</text>
</svg>
